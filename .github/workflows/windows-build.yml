name: Windows build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version, e.g. 0.1.0 (leave empty for a test build)"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # only used to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Work out version
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
        run: |
          $release = "$env:RELEASE_INPUT".Trim().TrimStart("v")
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" }
          elseif ($release) { $v = "v$release" }
          else { $v = "dev-${{ github.run_number }}" }
          if ($v -like "v*") {
            # A release must match the version in the code.
            $code = (Select-String -Path src/opendrivehealth/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
            if ($v -ne "v$code") { throw "Release $v doesn't match __version__ $code" }
            "RELEASE=true" >> $env:GITHUB_ENV
          }
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: Install smartmontools
        run: choco install smartmontools -y --no-progress
      - name: Build
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version $env:VERSION
      - name: Smoke test
        shell: pwsh
        run: |
          ./dist/odh.exe --version
          ./dist/odh.exe --demo --no-color
          if ($LASTEXITCODE) { throw "demo failed" }
          # Real scan on the runner's virtual disk: just make sure the bundled
          # smartctl runs (no drives / no SMART is fine, exit code 3).
          ./dist/odh.exe list --no-color
          if ($LASTEXITCODE -notin 0,1,2,3) { throw "unexpected exit $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDriveHealth-windows
          path: dist/OpenDriveHealth-*-windows.zip
      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: OpenDriveHealth ${{ env.VERSION }}
          files: dist/OpenDriveHealth-*-windows.zip
          body: |
            **Windows:** download `OpenDriveHealth-${{ env.VERSION }}-windows.zip` below, unzip it and run
            `OpenDriveHealth.exe`. No Python needed. This build isn't code-signed, so SmartScreen may warn you:
            choose *More info → Run anyway*.

            **Linux / macOS:** install smartmontools, then `pip install` from source; see the README.

            What's new: see [CHANGELOG.md](https://github.com/soulhacler/OpenDriveHealth/blob/${{ env.VERSION }}/CHANGELOG.md).
