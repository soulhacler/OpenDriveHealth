name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: other
    attributes:
      label: Do other tools do this?
      description: e.g. how CrystalDiskInfo, HDD Sentinel or Samsung Magician handles it.
